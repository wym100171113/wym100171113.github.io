<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#fefdfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    try {
      var t = localStorage.getItem("wym-blog-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var root = document.documentElement;
      root.setAttribute("data-theme", t);
      /* 画布底色前置：html 背景会传播给浏览器画布，跨页导航时新文档在
         style.css 到位前就是主题色，消除暗色模式闪白。色值与 style.css --paper 同步 */
      root.style.background = t === "dark" ? "#121214" : "#fefdfa";
      root.style.colorScheme = t;
    } catch (e) {}
  })();
</script>
<script>
  /* 提前发起索引请求：与 CDN 库的下载并行，省掉一次串行往返。
     blog.js 的 getPosts() 会优先复用这个 Promise，不会重复请求。 */
  window.__posts = fetch("/posts/index.json", { cache: "no-cache" });
</script>

     z-index:1 之下，被 sticky 页眉（z-index:50）完全遮住。 -->

<main class="shell" id="main" data-view="post">
  <!-- 骨架屏直接写在这里：JS 与 CDN 库到位之前就已经占住版面，不必等脚本执行。
       它由 CSS 延迟 300ms 才淡入，加载够快时不会露面；blog.js 渲染完成后整块替换掉 -->
  <div class="skeleton" aria-hidden="true">
    <span class="title"></span>
    <span class="w1"></span><span class="w2"></span><span class="w3"></span><span class="w4"></span>
    <span class="w1"></span><span class="w2"></span><span class="w3"></span>

</main>
