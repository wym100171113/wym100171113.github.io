<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; } .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; } .c-gray { color: #6b7280; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; } .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; } .c-gray { color: #8e8e93; fill: #8e8e93; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.14; }
  </style>
  <text x="320" y="30" font-size="16" class="c-ink" text-anchor="middle" font-weight="600">二面角与它的平面角</text>
  <!-- 半平面 α（左）与 β（右），共棱 l -->
  <polygon points="330,80 170,140 170,380 330,320" class="c-blue semi" stroke="currentColor" stroke-width="1.4"/>
  <polygon points="330,80 500,150 500,390 330,320" class="c-green semi" stroke="currentColor" stroke-width="1.4"/>
  <!-- 棱 l -->
  <line x1="330" y1="50" x2="330" y2="350" stroke="currentColor" stroke-width="2" class="c-ink"/>
  <text x="342" y="58" font-size="15" class="c-ink" font-style="italic">l</text>
  <text x="196" y="352" font-size="15" class="c-blue" font-style="italic">α</text>
  <text x="462" y="364" font-size="15" class="c-green" font-style="italic">β</text>
  <!-- 平面角：OA ⊂ α，OB ⊂ β，均垂直于棱 -->
  <line x1="330" y1="205" x2="227" y2="243.6" stroke="currentColor" stroke-width="1.8" class="c-blue"/>
  <line x1="330" y1="205" x2="431.8" y2="246.9" stroke="currentColor" stroke-width="1.8" class="c-green"/>
  <!-- 直角标记（OA⊥l 与 OB⊥l） -->
  <path d="M330,217 L318.8,221.2 L318.8,209.2" class="nf" stroke="currentColor" stroke-width="1.2"/>
  <path d="M330,217 L341.1,221.6 L341.1,209.6" class="nf" stroke="currentColor" stroke-width="1.2"/>
  <!-- 平面角 θ 的弧 -->
  <path d="M298.2,216.9 A34,34 0 0 0 361.5,217.9" class="nf" stroke="currentColor" stroke-width="1.3"/>
  <text x="322" y="262" font-size="14" class="c-ink" font-style="italic">θ</text>
  <!-- 点与标签 -->
  <circle cx="330" cy="205" r="4" fill="currentColor" class="c-ink"/>
  <circle cx="227" cy="243.6" r="4" fill="currentColor" class="c-blue"/>
  <circle cx="431.8" cy="246.9" r="4" fill="currentColor" class="c-green"/>
  <text x="312" y="196" font-size="14" class="c-ink">O</text>
  <text x="206" y="262" font-size="14" class="c-blue">A</text>
  <text x="440" y="266" font-size="14" class="c-green">B</text>
  <text x="226" y="196" font-size="12.5" class="c-gray">OA ⟂ l</text>
  <text x="392" y="200" font-size="12.5" class="c-gray">OB ⟂ l</text>
  <text x="320" y="392" font-size="12.5" class="c-gray" text-anchor="middle">在棱上任取一点 O，两个半平面内各作棱的垂线 OA、OB，∠AOB 就是二面角 α-l-β 的平面角</text>
</svg>
