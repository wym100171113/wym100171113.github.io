<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
<style>
  .c-red { color: #d63e3e; fill: #d63e3e; } .c-green { color: #2e8b57; fill: #2e8b57; }
  .c-blue { color: #3c6eb9; fill: #3c6eb9; }
  .c-ink { color: #1c1c1e; fill: #1c1c1e; } .c-gray { color: #6b7280; fill: #6b7280; }
  @media (prefers-color-scheme: dark) {
    .c-red { color: #f07070; fill: #f07070; } .c-green { color: #4caf7d; fill: #4caf7d; }
    .c-blue { color: #6b9df0; fill: #6b9df0; }
    .c-ink { color: #d8d8de; fill: #d8d8de; } .c-gray { color: #8e8e93; fill: #8e8e93; }
  }
</style>

<!-- P2:中间层,虚线(逐层转 36°、缩放 cos 36°) -->
<polygon points="384.2,141.6 423.9,263.8 320.0,339.2 216.1,263.8 255.8,141.6" fill="none" class="c-gray" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.85" style="fill:none"/>
<!-- P6:隔 5 层,与 P1 同向 -->
<polygon points="320.0,276.8 275.5,244.5 292.5,192.1 347.5,192.1 364.5,244.5" fill="none" class="c-blue" stroke="currentColor" stroke-width="1.8" style="fill:none"/>
<!-- P1:外层 -->
<polygon points="320.0,95.0 448.4,188.3 399.4,339.2 240.6,339.2 191.6,188.3" fill="none" class="c-blue" stroke="currentColor" stroke-width="1.8" style="fill:none"/>

<!-- 半径 OA2(A1B1 与 A6B6 的弧中点所在直线) -->
<line x1="320.0" y1="230.0" x2="384.2" y2="141.6" class="c-gray" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

<!-- 等腰梯形 A1B1B6A6:两底 A1B1 ∥ A6B6 -->
<polygon points="320.0,95.0 448.4,188.3 275.5,244.5 320.0,276.8" class="c-red" style="fill:currentColor; fill-opacity:0.10" stroke="none"/>
<g class="c-red" fill="none" stroke="currentColor">
  <line x1="448.4" y1="188.3" x2="275.5" y2="244.5" stroke-width="2"/>
  <line x1="320.0" y1="276.8" x2="320.0" y2="95.0" stroke-width="2"/>
  <line x1="320.0" y1="95.0" x2="448.4" y2="188.3" stroke-width="3.5"/>
  <line x1="275.5" y1="244.5" x2="320.0" y2="276.8" stroke-width="3.5"/>
</g>
<g class="c-red">
  <circle cx="320.0" cy="95.0"   r="6.5" fill="currentColor" stroke="white" stroke-width="1.4"/>
  <circle cx="448.4" cy="188.3"  r="6.5" fill="currentColor" stroke="white" stroke-width="1.4"/>
  <circle cx="275.5" cy="244.5"  r="6.5" fill="currentColor" stroke="white" stroke-width="1.4"/>
  <circle cx="320.0" cy="276.8"  r="6.5" fill="currentColor" stroke="white" stroke-width="1.4"/>
</g>
<!-- 其余顶点小点 -->
<g class="c-blue">
  <circle cx="399.4" cy="339.2" r="4" fill="currentColor"/>
  <circle cx="240.6" cy="339.2" r="4" fill="currentColor"/>
  <circle cx="191.6" cy="188.3" r="4" fill="currentColor"/>
  <circle cx="292.5" cy="192.1" r="3.4" fill="currentColor"/>
  <circle cx="347.5" cy="192.1" r="3.4" fill="currentColor"/>
  <circle cx="364.5" cy="244.5" r="3.4" fill="currentColor"/>
</g>
<!-- 中心 O -->
<circle cx="320.0" cy="230.0" r="2.6" class="c-gray" fill="currentColor"/>

<text x="304" y="82"  class="c-ink" font-size="14">A₁</text>
<text x="462" y="186" class="c-ink" font-size="14">B₁</text>
<text x="410" y="354" class="c-ink" font-size="14">C₁</text>
<text x="228" y="354" class="c-ink" font-size="14">D₁</text>
<text x="176" y="184" class="c-ink" font-size="14">E₁</text>
<text x="329" y="299" class="c-ink" font-size="12">A₆</text>
<text x="252" y="249" class="c-ink" font-size="12">B₆</text>
<text x="274" y="184" class="c-ink" font-size="12">C₆</text>
<text x="364" y="196" class="c-ink" font-size="12">D₆</text>
<text x="375" y="240" class="c-ink" font-size="12">E₆</text>
<text x="334" y="236" class="c-gray" font-size="11">O</text>

<text x="464" y="100" class="c-gray" font-size="13">P₁</text>
<text x="250" y="318" class="c-gray" font-size="13">P₂</text>
<text x="378" y="272" class="c-gray" font-size="13">P₆</text>

<text x="320" y="28" text-anchor="middle" class="c-ink" font-size="18" font-weight="600">嵌套正五边形:隔 5 层同向,对应弦构成等腰梯形</text>
<text x="320" y="428" text-anchor="middle" class="c-gray" font-size="13">P₁(外)与 P₆(隔 5 层)同向:转了 180°、对应边互相平行;虚线 P₂ 是中间层,示意每层转 36°、缩放 cos 36°</text>
<text x="320" y="448" text-anchor="middle" class="c-gray" font-size="13">红色四边形 A₁B₁B₆A₆:A₁B₁ 与 A₆B₆ 的弧中点同在 OA₂ 所在直线上,两弦平行 → 等腰梯形 → 四点共圆</text>
</svg>