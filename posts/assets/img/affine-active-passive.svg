<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-purple { color: #8554c8; fill: #8554c8; }
    .c-orange { color: #c97a1e; fill: #c97a1e; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    .c-faint { color: #9aa0a6; fill: #9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-purple { color: #b795ee; fill: #b795ee; }
      .c-orange { color: #e0a24f; fill: #e0a24f; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
      .c-faint { color: #6e6e75; fill: #6e6e75; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.16; }
    .thin { fill-opacity: 0.10; }
  </style>
<text x="330.0" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">两种视角：动图形，还是动坐标轴</text>
<text x="330.0" y="396.0" font-size="11.5" class="c-gray" text-anchor="middle">左边是主动：图形沿 30° 旋转；右边是被动：图形不动，坐标轴反向转 30°</text>
<text x="330.0" y="412.0" font-size="11" class="c-faint" text-anchor="middle">同一个矩阵，两种读法：主动是点的变换，被动是坐标轴的变换</text>
<line x1="66" y1="200" x2="274" y2="200" class="c-gray" stroke="currentColor" stroke-width="1"/>
<line x1="170" y1="104" x2="170" y2="296" class="c-gray" stroke="currentColor" stroke-width="1"/>
<text x="280" y="215" font-size="12" class="c-gray">x</text>
<text x="176" y="112" font-size="12" class="c-gray">y</text>
<polygon points="170,200 239,200 204.5,140.2" class="c-faint nf thin" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4,4"/>
<polygon points="170,200 229.76,165.5 169.98,130.96" class="c-blue semi" stroke="currentColor" stroke-width="1.6"/>
<circle cx="239.0" cy="200.0" r="3" class="c-faint"/>
<circle cx="229.8" cy="165.5" r="4" class="c-blue"/>
<path d="M 229.8 200.0 A 59.8 59.8 0 0 0 221.8 170.1" class="c-gray nf" stroke="currentColor" stroke-width="1.3"/>
<text x="245.1" y="183.9" font-size="12.5" class="c-gray" text-anchor="middle" font-weight="500">θ = 30°</text>
<text x="170.0" y="350.0" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">主动：图形转 30°</text>
<text x="170.0" y="368.0" font-size="11.5" class="c-gray" text-anchor="middle">坐标轴不动，物体动</text>
<line x1="366" y1="200" x2="574" y2="200" class="c-gray" stroke="currentColor" stroke-width="1"/>
<line x1="470" y1="104" x2="470" y2="296" class="c-gray" stroke="currentColor" stroke-width="1"/>
<text x="580" y="215" font-size="12" class="c-gray">x</text>
<text x="476" y="112" font-size="12" class="c-gray">y</text>
<line x1="470" y1="200" x2="553.1" y2="152.0" class="c-red" stroke="currentColor" stroke-width="1.4"/>
<line x1="470" y1="200" x2="518.0" y2="283.1" class="c-green" stroke="currentColor" stroke-width="1.4"/>
<text x="559.1" y="168.0" font-size="12" class="c-red">x′</text>
<text x="522.0" y="277.1" font-size="12" class="c-green">y′</text>
<polygon points="170,200 239,200 204.5,140.2" class="c-blue semi" stroke="currentColor" stroke-width="1.6" transform="translate(300.0,0)"/>
<text x="470.0" y="350.0" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">被动：坐标轴转 −30°</text>
<text x="470.0" y="368.0" font-size="11.5" class="c-gray" text-anchor="middle">图形不动，坐标轴动</text>
</svg>
