<text x="330.0" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">仿射 = 线性 + 平移；线性 = 旋转·缩放·切变</text>
<text x="330.0" y="380.0" font-size="11.5" class="c-gray" text-anchor="middle">旋转保长保角，缩放改长不改角，切变改角不改长——三者都是可逆的仿射</text>
<text x="330.0" y="396.0" font-size="11" class="c-faint" text-anchor="middle">切变保持每条水平线的长度，却把竖边推斜：正方形变成了平行四边形</text>
<text x="120.0" y="120" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">旋转</text><text x="120.0" y="140" font-size="11.5" class="c-gray" text-anchor="middle">x′=x cosθ − y sinθ</text>
