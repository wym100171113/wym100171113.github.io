<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#26303d"] { fill: #d8d8de; }
      [stroke="#26303d"] { stroke: #d8d8de; }
      [fill="#1c1c1e"] { fill: #d8d8de; }
      [stroke="#1c1c1e"] { stroke: #d8d8de; }
      [fill="white"] { fill: #2a2a2e; }
      [fill="#ffffff"] { fill: #2a2a2e; }
      [fill="#3c6eb9"] { fill: #6b9df0; }
      [stroke="#3c6eb9"] { stroke: #6b9df0; }
      [fill="#d63e3e"] { fill: #f07070; }
      [stroke="#d63e3e"] { stroke: #f07070; }
      [fill="#2e8b57"] { fill: #4caf7d; }
      [stroke="#2e8b57"] { stroke: #4caf7d; }
      [fill="#96999f"] { fill: #6b6b72; }
      [stroke="#96999f"] { stroke: #6b6b72; }
      [stroke="#bcc0c8"] { stroke: #3a3a40; }
      [fill="#d0e0f6"] { fill: #1f3a5c; }
      [stroke="#4e6c9e"] { stroke: #7e9cc8; }
      [fill-opacity="0.25"] { fill-opacity: 0.4; }
      [fill="#3b82f6"] { fill: #7db2ff; }
      [stroke="#3b82f6"] { stroke: #7db2ff; }
      [fill="#f59e0b"] { fill: #fbbf24; }
      [stroke="#f59e0b"] { stroke: #fbbf24; }
      [fill="#eff6ff"] { fill: #1c2a44; }
      [fill="#dbeafe"] { fill: #1c2f4d; }
      [fill="#fef3c7"] { fill: #4a3a1a; }
      [fill="#6b7280"] { fill: #8e8e93; }
      [fill="#9ca3af"] { fill: #5b5b60; }
      [stroke="#d1d5db"] { stroke: #3a3a40; }
      [stroke="#e5e7eb"] { stroke: #2a2a2e; }
    }
  </style>
  <!-- 标题 -->
  <text x="320" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1c1e">奶糖 × 巧克力:总共拿 2 颗</text>

  <!-- 左列:奶糖 -->
  <text x="150" y="66" text-anchor="middle" font-size="14" fill="#1c1c1e">奶糖</text>
  <text x="150" y="86" text-anchor="middle" font-size="13" fill="#6b7280">1 + x + x²</text>
  <circle cx="150" cy="122" r="18" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="150" y="128" text-anchor="middle" font-size="14" fill="#1c1c1e">0</text>
  <circle cx="150" cy="206" r="18" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="150" y="212" text-anchor="middle" font-size="14" fill="#1c1c1e">1</text>
  <circle cx="150" cy="290" r="18" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="150" y="296" text-anchor="middle" font-size="14" fill="#1c1c1e">2</text>
  <text x="184" y="126" font-size="12" fill="#9ca3af">颗</text>
  <text x="184" y="210" font-size="12" fill="#9ca3af">颗</text>
  <text x="184" y="294" font-size="12" fill="#9ca3af">颗</text>

  <!-- 中列:巧克力 -->
  <text x="330" y="66" text-anchor="middle" font-size="14" fill="#1c1c1e">巧克力</text>
  <text x="330" y="86" text-anchor="middle" font-size="13" fill="#6b7280">1 + x</text>
  <circle cx="330" cy="158" r="18" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="330" y="164" text-anchor="middle" font-size="14" fill="#1c1c1e">0</text>
  <circle cx="330" cy="266" r="18" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>
  <text x="330" y="272" text-anchor="middle" font-size="14" fill="#1c1c1e">1</text>
  <text x="364" y="162" font-size="12" fill="#9ca3af">颗</text>
  <text x="364" y="270" font-size="12" fill="#9ca3af">颗</text>

  <!-- 路径 1(蓝):奶糖 1 → 巧克力 1 -->
  <path d="M 168 200 C 240 268, 270 272, 312 268" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="312,262 320,269 311,274" fill="#3b82f6"/>
  <path d="M 348 262 C 430 250, 470 214, 506 200" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="506,192 515,200 505,204" fill="#3b82f6"/>

  <!-- 路径 2(橙):奶糖 2 → 巧克力 0 -->
  <path d="M 168 284 C 240 226, 270 180, 312 162" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="308,156 320,160 310,169" fill="#f59e0b"/>
  <path d="M 348 158 C 430 168, 470 190, 506 200" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="506,192 515,200 505,204" fill="#f59e0b"/>

  <!-- 结果 -->
  <rect x="520" y="170" width="76" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="558" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1c1e">x²</text>
  <text x="558" y="219" text-anchor="middle" font-size="13" fill="#3b82f6">系数 = 2</text>

  <!-- 底部注释 -->
  <line x1="60" y1="338" x2="580" y2="338" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="362" text-anchor="middle" font-size="13" fill="#6b7280">每种拿法 = 一条路径;两条路径都凑成 2 颗糖,在 x² 处合并,系数相加</text>
  <text x="320" y="382" text-anchor="middle" font-size="13" fill="#6b7280">1 + 1 = 2 颗(蓝), 2 + 0 = 2 颗(橙)→ 共 2 种拿法</text>
</svg>
