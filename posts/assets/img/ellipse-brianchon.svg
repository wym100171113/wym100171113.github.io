<text x="320.0" y="430.0" font-size="12.5" class="c-ink" text-anchor="middle">六条边都与椭圆相切；AD、BE、CF 交于同一点 P</text>
<text x="320.0" y="450.0" font-size="11.5" class="c-gray" text-anchor="middle">P 恰是六个切点构成的内接六边形那条帕斯卡线的极点——帕斯卡的镜像</text>
