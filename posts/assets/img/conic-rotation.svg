<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    .c-faint { color: #9aa0a6; fill: #9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
      .c-faint { color: #6e6e75; fill: #6e6e75; }
    }
    .nf { fill: none; }
  </style>
<text x="320" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">旋转矩阵是怎么来的</text>
<line x1="30" y1="210.0" x2="600" y2="210.0" class="c-gray" stroke="currentColor" stroke-width="1"/>
<line x1="170.0" y1="46" x2="170.0" y2="372" class="c-gray" stroke="currentColor" stroke-width="1"/>
<text x="606" y="214" font-size="12" class="c-gray">x</text>
<text x="176.0" y="44" font-size="12" class="c-gray">y</text>
<circle cx="170.0" cy="210.0" r="150.0" class="c-faint nf" stroke="currentColor" stroke-width="1" stroke-dasharray="4,5"/>
<line x1="170.0" y1="210.0" x2="305.9" y2="146.6" class="c-blue" stroke="currentColor" stroke-width="1.7"/>
<line x1="170.0" y1="210.0" x2="233.4" y2="74.1" class="c-red" stroke="currentColor" stroke-width="1.7"/>
<line x1="305.9" y1="146.6" x2="305.9" y2="210.0" class="c-faint" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="233.4" y1="74.1" x2="233.4" y2="210.0" class="c-faint" stroke="currentColor" stroke-width="1" stroke-dasharray="4,4"/>
<path d="M 225 210 A 55 55 0 0 0 219.8 186.8" class="c-gray nf" stroke="currentColor" stroke-width="1.3"/>
<path d="M 240.7 177.0 A 78 78 0 0 0 203.0 139.3" class="c-green nf" stroke="currentColor" stroke-width="1.3"/>
<circle cx="305.9" cy="146.6" r="4.5" class="c-blue"/>
<circle cx="233.4" cy="74.1" r="4.5" class="c-red"/>
<circle cx="170.0" cy="210.0" r="3" class="c-ink"/>
<text x="316.9" y="153.6" font-size="12" class="c-blue">P(x, y)</text>
<text x="244.4" y="81.1" font-size="12" class="c-red">P′(x′, y′)</text>
<text x="234" y="203" font-size="12" class="c-gray">φ</text>
<text x="242" y="157" font-size="12" class="c-green">θ</text>
<text x="186" y="140" font-size="12" class="c-red" text-anchor="end">r</text>
<text x="320" y="392" font-size="11.5" class="c-gray" text-anchor="middle">旋转只做两件事：到原点的距离不变（OP = OP′ = r），角度相加（φ → φ + θ）</text>
<text x="320" y="412" font-size="11" class="c-faint" text-anchor="middle">把这两件事写出来再用一次和角公式，就是 (x′, y′) = (x cosθ − y sinθ, x sinθ + y cosθ)</text></svg>
