<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
    }
    .nf { fill: none; }
  </style>

  <text x="320" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">六项式的解剖：系数 → 不变量 → 结论</text>

  <rect x="120" y="44" width="400" height="40" rx="8" class="c-ink nf" stroke="currentColor" stroke-width="1.4"/>
  <text x="320" y="69" font-size="15" class="c-ink" text-anchor="middle">Ax² + Bxy + Cy² + Dx + Ey + F = 0</text>

  <line x1="320" y1="84" x2="320" y2="102" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="120" y1="102" x2="520" y2="102" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="120" y1="102" x2="120" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="320" y1="102" x2="320" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="520" y1="102" x2="520" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="120,122 116,112 124,112" class="c-gray"/>
  <polygon points="320,122 316,112 324,112" class="c-gray"/>
  <polygon points="520,122 516,112 524,112" class="c-gray"/>

  <rect x="35" y="122" width="170" height="56" rx="8" class="c-red" fill-opacity="0.07" stroke="currentColor" stroke-width="1.2"/>
  <text x="120" y="147" font-size="12.5" class="c-red" text-anchor="middle">M = [A, B/2; B/2, C]</text>
  <text x="120" y="167" font-size="11.5" class="c-gray" text-anchor="middle">决定形状</text>

  <rect x="235" y="122" width="170" height="56" rx="8" class="c-blue" fill-opacity="0.07" stroke="currentColor" stroke-width="1.2"/>
  <text x="320" y="147" font-size="12.5" class="c-blue" text-anchor="middle">b = (D/2, E/2)</text>
  <text x="320" y="167" font-size="11.5" class="c-gray" text-anchor="middle">决定位置</text>

  <rect x="435" y="122" width="170" height="56" rx="8" class="c-green" fill-opacity="0.07" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="147" font-size="12.5" class="c-green" text-anchor="middle">c = F</text>
  <text x="520" y="167" font-size="11.5" class="c-gray" text-anchor="middle">决定大小</text>

  <line x1="120" y1="178" x2="120" y2="198" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="320" y1="178" x2="320" y2="198" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="520" y1="178" x2="520" y2="198" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="120,198 116,188 124,188" class="c-gray"/>
  <polygon points="320,198 316,188 324,188" class="c-gray"/>
  <polygon points="520,198 516,188 524,188" class="c-gray"/>

  <rect x="35" y="198" width="170" height="90" rx="8" class="c-red nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="120" y="222" font-size="12.5" class="c-red" text-anchor="middle">I₁ = A + C</text>
  <text x="120" y="246" font-size="12.5" class="c-red" text-anchor="middle">I₂ = AC − B²/4</text>
  <text x="120" y="270" font-size="12.5" class="c-red" text-anchor="middle">I₃ = det Q</text>

  <rect x="235" y="198" width="170" height="90" rx="8" class="c-blue nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="320" y="233" font-size="12.5" class="c-blue" text-anchor="middle">中心 x₀</text>
  <text x="320" y="257" font-size="11.5" class="c-gray" text-anchor="middle">解 ∇f = 0</text>

  <rect x="435" y="198" width="170" height="90" rx="8" class="c-green nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="233" font-size="12.5" class="c-green" text-anchor="middle">μ = I₃ / I₂</text>
  <text x="520" y="257" font-size="11.5" class="c-gray" text-anchor="middle">曲线在中心处的值</text>

  <line x1="120" y1="288" x2="120" y2="308" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="320" y1="288" x2="320" y2="308" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="520" y1="288" x2="520" y2="308" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="120,308 116,298 124,298" class="c-gray"/>
  <polygon points="320,308 316,298 324,298" class="c-gray"/>
  <polygon points="520,308 516,298 524,298" class="c-gray"/>

  <rect x="35" y="308" width="170" height="56" rx="8" class="c-ink nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="120" y="332" font-size="11.5" class="c-ink" text-anchor="middle">I₂ → 类型</text>
  <text x="120" y="352" font-size="11.5" class="c-ink" text-anchor="middle">I₁, I₂ → 离心率</text>

  <rect x="235" y="308" width="170" height="56" rx="8" class="c-ink nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="320" y="342" font-size="11.5" class="c-ink" text-anchor="middle">平移到位</text>

  <rect x="435" y="308" width="170" height="56" rx="8" class="c-ink nf" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="342" font-size="11.5" class="c-ink" text-anchor="middle">半轴 = √(−μ/λ)</text>

  <text x="320" y="388" font-size="11.5" class="c-gray" text-anchor="middle">三个不变量在平移与旋转下都不变 —— 可以跳过这两步，直接读答案</text>
</svg>
