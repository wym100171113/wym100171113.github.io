<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#26303d"] { fill: #d8d8de; }
      [fill="#1c1c1e"] { fill: #d8d8de; }
      [stroke="#1c1c1e"] { stroke: #d8d8de; }
      [fill="#d63e3e"] { fill: #f07070; }
      [stroke="#d63e3e"] { stroke: #f07070; }
      [fill="#3c6eb9"] { fill: #6b9df0; }
      [stroke="#3c6eb9"] { stroke: #6b9df0; }
      [fill="#96999f"] { fill: #6b6b72; }
      [stroke="#96999f"] { stroke: #6b6b72; }
      [fill="#d1d5db"] { fill: #3a3a40; }
      [stroke="#d1d5db"] { stroke: #3a3a40; }
      [fill="#fef9e7"] { fill: #4a3d1a; }
      [stroke="#fef9e7"] { stroke: #4a3d1a; }
    }
  </style>

  <!-- 标题 -->
  <text x="320" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1c1e">杨辉三角:肩上两数相加</text>

  <!-- 行 0 -->
  <text x="320" y="70"  text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <!-- 行 1 -->
  <text x="298" y="130" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <text x="342" y="130" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <!-- 行 2 -->
  <text x="276" y="190" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <text x="320" y="190" text-anchor="middle" font-size="15" fill="#26303d">2</text>
  <text x="364" y="190" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <!-- 行 3 -->
  <text x="254" y="250" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <text x="298" y="250" text-anchor="middle" font-size="15" fill="#26303d">3</text>
  <text x="342" y="250" text-anchor="middle" font-size="15" fill="#26303d">3</text>
  <text x="386" y="250" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <!-- 行 4 -->
  <text x="232" y="310" text-anchor="middle" font-size="15" fill="#3c6eb9">1</text>
  <text x="276" y="310" text-anchor="middle" font-size="15" fill="#26303d">4</text>
  <text x="320" y="310" text-anchor="middle" font-size="16" font-weight="600" fill="#d63e3e">6</text>
  <text x="364" y="310" text-anchor="middle" font-size="16" font-weight="600" fill="#d63e3e">4</text>
  <text x="408" y="310" text-anchor="middle" font-size="15" fill="#3c6eb9">1</text>
  <!-- 行 5 -->
  <text x="210" y="370" text-anchor="middle" font-size="15" fill="#3c6eb9">1</text>
  <text x="254" y="370" text-anchor="middle" font-size="15" fill="#26303d">5</text>
  <text x="298" y="370" text-anchor="middle" font-size="15" fill="#26303d">10</text>
  <text x="342" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#d63e3e">10</text>
  <text x="386" y="370" text-anchor="middle" font-size="15" fill="#26303d">5</text>
  <text x="430" y="370" text-anchor="middle" font-size="15" fill="#3c6eb9">1</text>
  <!-- 行 6 -->
  <text x="188" y="430" text-anchor="middle" font-size="15" fill="#26303d">1</text>
  <text x="232" y="430" text-anchor="middle" font-size="15" fill="#26303d">6</text>
  <text x="276" y="430" text-anchor="middle" font-size="15" fill="#26303d">15</text>
  <text x="320" y="430" text-anchor="middle" font-size="15" fill="#26303d">20</text>
  <text x="364" y="430" text-anchor="middle" font-size="15" fill="#26303d">15</text>
  <text x="408" y="430" text-anchor="middle" font-size="15" fill="#26303d">6</text>
  <text x="452" y="430" text-anchor="middle" font-size="15" fill="#26303d">1</text>

  <!-- 肩上相加的箭头: 6,4 → 10(行 5 的 j=3,箭头止于数字上方不遮挡) -->
  <line x1="320" y1="314" x2="338" y2="344" stroke="#d63e3e" stroke-width="2"/>
  <polygon points="332,342 344,342 338,350" fill="#d63e3e"/>
  <line x1="364" y1="314" x2="346" y2="344" stroke="#d63e3e" stroke-width="2"/>
  <polygon points="340,342 352,342 346,350" fill="#d63e3e"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#d63e3e">6 + 4 = 10</text>

  <!-- 行和标注(右侧) -->
  <text x="500" y="70"  text-anchor="start" font-size="12" fill="#96999f">2⁰ = 1</text>
  <text x="500" y="130" text-anchor="start" font-size="12" fill="#96999f">2¹ = 2</text>
  <text x="500" y="190" text-anchor="start" font-size="12" fill="#96999f">2² = 4</text>
  <text x="500" y="250" text-anchor="start" font-size="12" fill="#96999f">2³ = 8</text>
  <text x="500" y="310" text-anchor="start" font-size="12" fill="#96999f">2⁴ = 16</text>
  <text x="500" y="370" text-anchor="start" font-size="12" fill="#96999f">2⁵ = 32</text>
  <text x="500" y="430" text-anchor="start" font-size="12" fill="#96999f">2⁶ = 64</text>

  <!-- 底部注释 -->
  <line x1="60" y1="480" x2="580" y2="480" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="506" text-anchor="middle" font-size="13" fill="#6b7280">两端都是 1(蓝色):左右对称 C(n,k) = C(n,n-k);每行之和 = 2ⁿ(右侧)</text>
  <text x="320" y="528" text-anchor="middle" font-size="13" fill="#6b7280">红色:每个数都是肩上两数之和 —— 杨辉恒等式</text>
</svg>
