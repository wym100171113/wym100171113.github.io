<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-purple { color: #8554c8; fill: #8554c8; }
    .c-orange { color: #c97a1e; fill: #c97a1e; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    .c-faint { color: #9aa0a6; fill: #9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-purple { color: #b795ee; fill: #b795ee; }
      .c-orange { color: #e0a24f; fill: #e0a24f; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
      .c-faint { color: #6e6e75; fill: #6e6e75; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.16; }
    .thin { fill-opacity: 0.10; }
  </style>
<text x="330.0" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">行列式 = 面积的有向缩放倍数</text>
<text x="330.0" y="352.0" font-size="11.5" class="c-gray" text-anchor="middle">det A = ad − bc = 2·1.5 − 1·0.5 = 2.5；平面上任何一块区域，面积都统一 ×|det A|</text>
<line x1="104" y1="280" x2="206" y2="280" class="c-faint nf" stroke="currentColor" stroke-width="0.9"/>
<line x1="110" y1="286" x2="110" y2="186" class="c-faint nf" stroke="currentColor" stroke-width="0.9"/>
<text x="210" y="284" font-size="11" class="c-gray">e₁</text>
<text x="114" y="184" font-size="11" class="c-gray">e₂</text>
<polygon points="110,280 188,280 188,202 110,202" class="c-gray semi" stroke="currentColor" stroke-width="1.4"/>
<text x="149" y="302" font-size="11.5" class="c-gray" text-anchor="middle">单位正方形</text>
<text x="149" y="320" font-size="12.5" class="c-ink" text-anchor="middle" font-weight="600">面积 = 1</text>
<polygon points="400,280 556,241 634,124 478,163" class="c-blue semi" stroke="currentColor" stroke-width="1.8"/>
<line x1="400" y1="280" x2="556" y2="241" class="c-red nf" stroke="currentColor" stroke-width="1.7"/>
<line x1="400" y1="280" x2="478" y2="163" class="c-green nf" stroke="currentColor" stroke-width="1.7"/>
<circle cx="400" cy="280" r="3" class="c-ink"/>
<circle cx="556" cy="241" r="3.4" class="c-red"/>
<circle cx="478" cy="163" r="3.4" class="c-green"/>
<text x="562" y="245" font-size="10.5" class="c-red">列1 = (2, 0.5)</text>
<text x="382" y="161" font-size="10.5" class="c-green">列2 = (1, 1.5)</text>
<text x="517" y="302" font-size="11.5" class="c-gray" text-anchor="middle">A·单位正方形 = 平行四边形</text>
<text x="517" y="322" font-size="12.5" class="c-blue" text-anchor="middle" font-weight="600">面积 = |det A| = 2.5</text>
</svg>
