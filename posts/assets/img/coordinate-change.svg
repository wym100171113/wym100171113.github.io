<svg xmlns="http://www.w3.org/2000/svg" width="660" height="434" viewBox="0 0 660 434" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-purple { color: #8554c8; fill: #8554c8; }
    .c-orange { color: #c97a1e; fill: #c97a1e; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    .c-faint { color: #9aa0a6; fill: #9aa0a6; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-purple { color: #b795ee; fill: #b795ee; }
      .c-orange { color: #e0a24f; fill: #e0a24f; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
      .c-faint { color: #6e6e75; fill: #6e6e75; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.16; }
    .thin { fill-opacity: 0.10; }
  </style>
<text x="330.0" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">坐标变换：点没动，坐标换了</text>
<text x="330.0" y="408.0" font-size="11.5" class="c-gray" text-anchor="middle">点 P 与两条直线 a、b 在空间中都是同一个，只是在新旧坐标系里读出的坐标不同</text>
<text x="330.0" y="424.0" font-size="11" class="c-faint" text-anchor="middle">把坐标轴换成另一组基，换的就是那个把坐标换算过去的矩阵</text>
<line x1="40" y1="210" x2="300" y2="210" class="c-gray" stroke="currentColor" stroke-width="1"/>
<line x1="170" y1="70" x2="170" y2="350" class="c-gray" stroke="currentColor" stroke-width="1"/>
<text x="306" y="225" font-size="12" class="c-gray">x</text>
<text x="176" y="64" font-size="12" class="c-gray">y</text>
<line x1="50" y1="330" x2="290" y2="90" class="c-blue" stroke="currentColor" stroke-width="1.5"/>
<line x1="275" y1="262.5" x2="80" y2="30" class="c-green" stroke="currentColor" stroke-width="1.5"/>
<text x="286" y="86" font-size="13" class="c-blue">a</text>
<text x="270" y="272" font-size="13" class="c-green">b</text>
<circle cx="265.0" cy="140.0" r="4.5" class="c-red"/>
<text x="273.0" y="144.0" font-size="13" class="c-red" font-weight="500">P</text>
<circle cx="170" cy="210" r="3" class="c-ink"/>
<text x="164" y="226" font-size="12" class="c-ink" text-anchor="end">O</text>
<text x="170.0" y="384" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">旧坐标：(x, y)</text>
<line x1="370" y1="330" x2="610" y2="90" class="c-blue" stroke="currentColor" stroke-width="1.6"/>
<line x1="595" y1="262.5" x2="400" y2="30" class="c-green" stroke="currentColor" stroke-width="1.6"/>
<line x1="585.0" y1="140.0" x2="568.3" y2="131.7" class="c-faint" stroke="currentColor" stroke-width="0.9" stroke-dasharray="4,4"/>
<line x1="585.0" y1="140.0" x2="506.7" y2="218.3" class="c-faint" stroke="currentColor" stroke-width="0.9" stroke-dasharray="4,4"/>
<polygon points="490.0,210.0 568.3,131.7 585.0,140.0 506.7,218.3" class="c-red thin" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="529.2" y="165.8" font-size="12" class="c-blue" text-anchor="middle" font-weight="600">u</text>
<text x="510.3" y="218.2" font-size="12" class="c-green" text-anchor="middle" font-weight="600">v</text>
<circle cx="490" cy="210" r="3" class="c-ink"/>
<text x="484" y="226" font-size="12" class="c-ink" text-anchor="end">O′</text>
<circle cx="585.0" cy="140.0" r="4.5" class="c-red"/>
<text x="593.0" y="134.0" font-size="13" class="c-red" font-weight="500">P</text>
<text x="606" y="86" font-size="13" class="c-blue">u 轴</text>
<text x="590" y="272" font-size="13" class="c-green">v 轴</text>
<text x="490.0" y="384" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">新坐标：(u, v)</text>
</svg>
