<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#26303d"] { fill: #d8d8de; }
      [fill="#1c1c1e"] { fill: #d8d8de; }
      [stroke="#1c1c1e"] { stroke: #d8d8de; }
      [fill="#3b82f6"] { fill: #7db2ff; }
      [stroke="#3b82f6"] { stroke: #7db2ff; }
      [fill="#96999f"] { fill: #6b6b72; }
      [stroke="#96999f"] { stroke: #6b6b72; }
      [fill="#6b7280"] { fill: #8e8e93; }
      [stroke="#6b7280"] { stroke: #8e8e93; }
      [stroke="#d1d5db"] { stroke: #3a3a40; }
    }
  </style>

  <!-- 标题 -->
  <text x="320" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1c1e">格路:每步向右或向上</text>

  <!-- 网格线(4 列 x 3 行) -->
  <line x1="80"  y1="120" x2="80"  y2="360" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="160" y1="120" x2="160" y2="360" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="240" y1="120" x2="240" y2="360" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="320" y1="120" x2="320" y2="360" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="400" y1="120" x2="400" y2="360" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="80"  y1="120" x2="400" y2="120" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="80"  y1="200" x2="400" y2="200" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="80"  y1="280" x2="400" y2="280" stroke="#d1d5db" stroke-width="1.2"/>
  <line x1="80"  y1="360" x2="400" y2="360" stroke="#d1d5db" stroke-width="1.2"/>

  <!-- 示例路径: (0,0)→(0,1)→(1,1)→(1,2)→(1,3)→(2,3)→(3,3)→(4,3) -->
  <polyline points="80,360 80,280 160,280 160,200 160,120 240,120 320,120 400,120"
            fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 格点 -->
  <g fill="#26303d">
    <circle cx="80"  cy="360" r="5"/><circle cx="160" cy="360" r="5"/><circle cx="240" cy="360" r="5"/>
    <circle cx="320" cy="360" r="5"/><circle cx="400" cy="360" r="5"/>
    <circle cx="80"  cy="280" r="5"/><circle cx="160" cy="280" r="5"/><circle cx="240" cy="280" r="5"/>
    <circle cx="320" cy="280" r="5"/><circle cx="400" cy="280" r="5"/>
    <circle cx="80"  cy="200" r="5"/><circle cx="160" cy="200" r="5"/><circle cx="240" cy="200" r="5"/>
    <circle cx="320" cy="200" r="5"/><circle cx="400" cy="200" r="5"/>
    <circle cx="80"  cy="120" r="5"/><circle cx="160" cy="120" r="5"/><circle cx="240" cy="120" r="5"/>
    <circle cx="320" cy="120" r="5"/><circle cx="400" cy="120" r="5"/>
  </g>

  <!-- 起点终点标注 -->
  <text x="80"  y="390" text-anchor="middle" font-size="13" fill="#1c1c1e">起点 (0,0)</text>
  <text x="400" y="96"  text-anchor="middle" font-size="13" fill="#1c1c1e">终点 (4,3)</text>

  <!-- 路径步数标注(↑ 紧贴对应的向上竖线段) -->
  <text x="100" y="330" text-anchor="start" font-size="12" fill="#3b82f6">↑</text>
  <text x="180" y="246" text-anchor="start" font-size="12" fill="#3b82f6">↑</text>
  <text x="180" y="166" text-anchor="start" font-size="12" fill="#3b82f6">↑</text>

  <!-- 底部说明 -->
  <line x1="60" y1="410" x2="580" y2="410" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="432" text-anchor="middle" font-size="13" fill="#6b7280">共 7 步:选 3 步向上(其余 4 步向右)→ 路径数 C(7,3) = 35</text>
</svg>
