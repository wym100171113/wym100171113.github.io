<text x="406" y="248" font-size="13.5" class="c-green" text-anchor="start" font-weight="600">1+3+⋯+(2n−1) = n²</text>
<text x="320" y="376" font-size="12.5" class="c-ink" text-anchor="middle">同一块面积数两遍：横着数一遍，一圈一圈向外数一遍——两个答案必须相等</text>
