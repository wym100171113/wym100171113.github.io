<text x="330.0" y="26" font-size="15" class="c-ink" text-anchor="middle" font-weight="600">坐标变换的用场：转轴消去交叉项</text>
<text x="330.0" y="368.0" font-size="11.5" class="c-gray" text-anchor="middle">二次型 3x² + 2xy + 3y² 的等值线是斜着的椭圆；把坐标轴转过 θ 后，交叉项消失</text>
<text x="330.0" y="384.0" font-size="11" class="c-faint" text-anchor="middle">tan2θ = B/(A−C) → ∞，转轴即消去交叉项，化为 2x′² + 4y′²（长轴对齐 x′）</text>
