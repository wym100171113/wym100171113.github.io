<text x="126.0" y="270.0" font-size="14" class="c-red" text-anchor="middle" font-weight="600">O</text>
<text x="438.4" y="277.0" font-size="14" class="c-blue" text-anchor="middle" font-weight="600">F₁</text>
<text x="385.4" y="73.2" font-size="14" class="c-blue" text-anchor="middle" font-weight="600">F₂</text>
<text x="287.2" y="268.0" font-size="12.5" class="c-gray" text-anchor="middle" font-weight="400">√3</text>
<text x="240.7" y="160.6" font-size="12.5" class="c-gray" text-anchor="middle" font-weight="400">√3</text>
<text x="435.9" y="162.6" font-size="14" class="c-red" text-anchor="middle" font-weight="600">1</text>
<text x="460.0" y="128.0" font-size="13" class="c-ink" text-anchor="start" font-weight="500">两个尖角被迫同色</text>
<text x="460.0" y="148.0" font-size="11.5" class="c-gray" text-anchor="start" font-weight="400">（底边三角形用满三色）</text>
<text x="460.0" y="188.0" font-size="13" class="c-ink" text-anchor="start" font-weight="400">两枚钻石共享尖角 O</text>
<text x="460.0" y="208.0" font-size="13" class="c-ink" text-anchor="start" font-weight="400">⟹ O、F₁、F₂ 全同色</text>
<text x="460.0" y="248.0" font-size="13.5" class="c-red" text-anchor="start" font-weight="600">但 F₁F₂ = 1</text>
<text x="460.0" y="268.0" font-size="13.5" class="c-red" text-anchor="start" font-weight="400">⟹ 3 色当场崩盘</text>
<text x="320.0" y="392.0" font-size="12.5" class="c-ink" text-anchor="middle" font-weight="400">7 个顶点、11 条单位边：3 种颜色必有两点相距 1 且同色 ⟹ 至少 4 色</text>
<text x="320.0" y="412.0" font-size="11.5" class="c-gray" text-anchor="middle" font-weight="400">1955 年上桌，一口气守住 63 年的下界纪录——直到 2018 年</text>
