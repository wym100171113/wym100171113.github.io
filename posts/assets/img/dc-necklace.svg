<text x="320" y="366" font-size="12.5" class="c-ink" text-anchor="middle">总数 2³ = 8 = 1 + 1 + 3 + 3 ⟹ 3 整除 2³ − 2</text>
<text x="320" y="392" font-size="11.5" class="c-gray" text-anchor="middle">一般地 aᵖ = a + p·m（p 素数，非单色类每类恰 p 条）⟹ aᵖ ≡ a (mod p)</text>
