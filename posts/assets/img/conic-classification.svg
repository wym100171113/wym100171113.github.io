<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; }
    .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; }
    .c-gray { color: #6b7280; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; }
      .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; }
      .c-gray { color: #8e8e93; fill: #8e8e93; }
    }
    .nf { fill: none; }
  </style>

  <text x="320" y="26" font-size="16" class="c-ink" text-anchor="middle" font-weight="600">一般二次曲线的分类地图</text>

  <rect x="170" y="44" width="300" height="40" rx="8" class="c-ink nf" stroke="currentColor" stroke-width="1.4"/>
  <text x="320" y="69" font-size="13.5" class="c-ink" text-anchor="middle">I₂ = AC − B²/4 的符号</text>

  <line x1="320" y1="84" x2="320" y2="102" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="120" y1="102" x2="520" y2="102" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="120" y1="102" x2="120" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="320" y1="102" x2="320" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="520" y1="102" x2="520" y2="122" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="120,122 116,112 124,112" class="c-gray"/>
  <polygon points="320,122 316,112 324,112" class="c-gray"/>
  <polygon points="520,122 516,112 524,112" class="c-gray"/>

  <rect x="35" y="122" width="170" height="54" rx="8" class="c-red" fill-opacity="0.09" stroke="currentColor" stroke-width="1.3"/>
  <text x="120" y="148" font-size="14" class="c-red" text-anchor="middle" font-weight="600">I₂ &gt; 0</text>
  <text x="120" y="167" font-size="11.5" class="c-red" text-anchor="middle">椭圆型</text>

  <rect x="235" y="122" width="170" height="54" rx="8" class="c-blue" fill-opacity="0.09" stroke="currentColor" stroke-width="1.3"/>
  <text x="320" y="148" font-size="14" class="c-blue" text-anchor="middle" font-weight="600">I₂ = 0</text>
  <text x="320" y="167" font-size="11.5" class="c-blue" text-anchor="middle">抛物型</text>

  <rect x="435" y="122" width="170" height="54" rx="8" class="c-green" fill-opacity="0.09" stroke="currentColor" stroke-width="1.3"/>
  <text x="520" y="148" font-size="14" class="c-green" text-anchor="middle" font-weight="600">I₂ &lt; 0</text>
  <text x="520" y="167" font-size="11.5" class="c-green" text-anchor="middle">双曲型</text>

  <line x1="120" y1="176" x2="120" y2="200" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="320" y1="176" x2="320" y2="200" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <line x1="520" y1="176" x2="520" y2="200" class="c-gray" stroke="currentColor" stroke-width="1.2"/>
  <polygon points="120,200 116,190 124,190" class="c-gray"/>
  <polygon points="320,200 316,190 324,190" class="c-gray"/>
  <polygon points="520,200 516,190 524,190" class="c-gray"/>

  <rect x="35" y="200" width="170" height="120" rx="8" class="c-red nf" stroke="currentColor" stroke-width="1.3"/>
  <text x="120" y="232" font-size="12" class="c-ink" text-anchor="middle">I₃ ≠ 0 → 椭圆</text>
  <text x="120" y="262" font-size="12" class="c-ink" text-anchor="middle">I₃ = 0 → 点 / 空集</text>
  <line x1="52" y1="284" x2="188" y2="284" class="c-gray" stroke="currentColor" stroke-width="1"/>
  <text x="120" y="306" font-size="11" class="c-gray" text-anchor="middle">有中心，可平移</text>

  <rect x="235" y="200" width="170" height="120" rx="8" class="c-blue nf" stroke="currentColor" stroke-width="1.3"/>
  <text x="320" y="232" font-size="12" class="c-ink" text-anchor="middle">I₃ ≠ 0 → 抛物线</text>
  <text x="320" y="262" font-size="12" class="c-ink" text-anchor="middle">I₃ = 0 → 平行直线</text>
  <line x1="252" y1="284" x2="388" y2="284" class="c-gray" stroke="currentColor" stroke-width="1"/>
  <text x="320" y="306" font-size="11" class="c-gray" text-anchor="middle">没有中心</text>

  <rect x="435" y="200" width="170" height="120" rx="8" class="c-green nf" stroke="currentColor" stroke-width="1.3"/>
  <text x="520" y="232" font-size="12" class="c-ink" text-anchor="middle">I₃ ≠ 0 → 双曲线</text>
  <text x="520" y="262" font-size="12" class="c-ink" text-anchor="middle">I₃ = 0 → 相交直线</text>
  <line x1="452" y1="284" x2="588" y2="284" class="c-gray" stroke="currentColor" stroke-width="1"/>
  <text x="520" y="306" font-size="11" class="c-gray" text-anchor="middle">有中心，可平移</text>

  <text x="320" y="352" font-size="11.5" class="c-gray" text-anchor="middle">三族的分界只看 I₂ 一个符号；退化与否只看 I₃ 是否为零</text>
  <text x="320" y="374" font-size="11.5" class="c-gray" text-anchor="middle">而平行直线族是实是虚，不变量给不出信息 —— 必须回到原方程</text>
</svg>
