<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
<style>
  .c-red { color: #d63e3e; fill: #d63e3e; } .c-green { color: #2e8b57; fill: #2e8b57; }
  .c-blue { color: #3c6eb9; fill: #3c6eb9; }
  .c-ink { color: #1c1c1e; fill: #1c1c1e; } .c-gray { color: #6b7280; fill: #6b7280; }
  @media (prefers-color-scheme: dark) {
    .c-red { color: #f07070; fill: #f07070; } .c-green { color: #4caf7d; fill: #4caf7d; }
    .c-blue { color: #6b9df0; fill: #6b9df0; }
    .c-ink { color: #d8d8de; fill: #d8d8de; } .c-gray { color: #8e8e93; fill: #8e8e93; }
  }
</style>

<!-- 六边形顶点:A(上) B C D E F,中心 (240,190),半径 120 -->
<!-- 边:红三角形 A-C-E,其余全蓝 -->

<g stroke-width="1.4">
  <line x1="240" y1="70"   x2="343.9" y2="130"  class="c-blue" stroke="currentColor"/>
  <line x1="240" y1="70"   x2="343.9" y2="250"  class="c-red"  stroke="currentColor"/>
  <line x1="240" y1="70"   x2="240"   y2="310"  class="c-blue" stroke="currentColor"/>
  <line x1="240" y1="70"   x2="136.1" y2="250"  class="c-red"  stroke="currentColor"/>
  <line x1="240" y1="70"   x2="136.1" y2="130"  class="c-blue" stroke="currentColor"/>

  <line x1="343.9" y1="130" x2="343.9" y2="250" class="c-blue" stroke="currentColor"/>
  <line x1="343.9" y1="130" x2="240"   y2="310" class="c-blue" stroke="currentColor"/>
  <line x1="343.9" y1="130" x2="136.1" y2="250" class="c-blue" stroke="currentColor"/>
  <line x1="343.9" y1="130" x2="136.1" y2="130" class="c-blue" stroke="currentColor"/>

  <line x1="343.9" y1="250" x2="240"   y2="310" class="c-blue" stroke="currentColor"/>
  <line x1="343.9" y1="250" x2="136.1" y2="250" class="c-red"  stroke="currentColor"/>
  <line x1="343.9" y1="250" x2="136.1" y2="130" class="c-blue" stroke="currentColor"/>

  <line x1="240" y1="310" x2="136.1" y2="250" class="c-blue" stroke="currentColor"/>
  <line x1="240" y1="310" x2="136.1" y2="130" class="c-blue" stroke="currentColor"/>
</g>

<!-- 高亮红色三角形 A-C-E -->
<g class="c-red" stroke="currentColor" stroke-width="3.4" fill="none">
  <line x1="240" y1="70"   x2="343.9" y2="250"/>
  <line x1="343.9" y1="250" x2="136.1" y2="250"/>
  <line x1="136.1" y1="250" x2="240" y2="70"/>
</g>

<!-- 顶点 -->
<circle cx="240"   cy="70"   r="10" class="c-red" fill="currentColor"/>
<circle cx="343.9" cy="130" r="10" class="c-ink" fill="currentColor"/>
<circle cx="343.9" cy="250" r="10" class="c-red"  fill="currentColor"/>
<circle cx="240"   cy="310" r="10" class="c-ink" fill="currentColor"/>
<circle cx="136.1" cy="250" r="10" class="c-red"  fill="currentColor"/>
<circle cx="136.1" cy="130" r="10" class="c-ink" fill="currentColor"/>

<!-- 顶点名 -->
<text x="232" y="52"  class="c-ink">A</text>
<text x="358" y="110" class="c-ink">B</text>
<text x="358" y="260" class="c-ink">C</text>
<text x="248" y="326" class="c-ink">D</text>
<text x="112" y="260" class="c-ink">E</text>
<text x="112" y="110" class="c-ink">F</text>

<!-- 图例 -->
<circle cx="60" cy="334" r="6" class="c-red"  fill="currentColor"/>
<text x="72" y="338"  class="c-ink" font-size="15">红边(认识)</text>
<circle cx="240" cy="334" r="6" class="c-blue" fill="currentColor"/>
<text x="252" y="338" class="c-ink" font-size="15">蓝边(不认识)</text>

<!-- 标题与标注 -->
<text x="240" y="30"  text-anchor="middle" class="c-ink"  font-size="19" font-weight="600">K₆ 的红蓝二染色</text>
<text x="240" y="53"  text-anchor="middle" class="c-gray" font-size="14">六个人 = 六个点,认识/不认识 = 红/蓝边</text>
<text x="240" y="368" text-anchor="middle" class="c-gray" font-size="12.5">抽屉原理:无论怎么染,总有同色三角形——加粗红色 △ACE 就是它</text>
</svg>