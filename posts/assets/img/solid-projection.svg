<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; } .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; } .c-gray { color: #6b7280; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; } .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; } .c-gray { color: #8e8e93; fill: #8e8e93; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.14; }
  </style>
  <text x="320" y="30" font-size="16" class="c-ink" text-anchor="middle" font-weight="600">点在平面上的投影：垂线、斜线与线面角</text>
  <!-- 平面 π：平行四边形 -->
  <polygon points="70,300 430,300 570,205 210,205" class="c-blue semi" stroke="currentColor" stroke-width="1.4"/>
  <text x="540" y="228" font-size="15" class="c-blue" font-style="italic">π</text>
  <!-- 垂线 PO（虚线） -->
  <line x1="240" y1="70" x2="240" y2="265" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 5" class="c-ink"/>
  <!-- 斜线 PA -->
  <line x1="240" y1="70" x2="400" y2="288" stroke="currentColor" stroke-width="1.8" class="c-red"/>
  <!-- 投影 OA -->
  <line x1="240" y1="265" x2="400" y2="288" stroke="currentColor" stroke-width="1.8" class="c-blue"/>
  <!-- 直角标记（O 处） -->
  <path d="M240,253 L251.9,254.7 L251.9,266.7" class="nf" stroke="currentColor" stroke-width="1.2"/>
  <!-- 线面角 θ（A 处，AO 与 AP 的夹角） -->
  <path d="M374.3,284.3 A26,26 0 0 1 384.6,267.0" class="nf" stroke="currentColor" stroke-width="1.3"/>
  <text x="360" y="272" font-size="14" class="c-ink" font-style="italic">θ</text>
  <!-- 点 -->
  <circle cx="240" cy="70" r="4.5" fill="currentColor" class="c-red"/>
  <circle cx="240" cy="265" r="4" fill="currentColor" class="c-ink"/>
  <circle cx="400" cy="288" r="4" fill="currentColor" class="c-red"/>
  <!-- 标签 -->
  <text x="252" y="66" font-size="15" class="c-red" font-weight="600">P</text>
  <text x="222" y="288" font-size="14" class="c-ink">垂足 O</text>
  <text x="406" y="310" font-size="14" class="c-red">斜足 A</text>
  <text x="228" y="170" font-size="13" class="c-gray" text-anchor="end">垂线 PO（最短）</text>
  <text x="316" y="146" font-size="13" class="c-red">斜线 PA</text>
  <text x="300" y="258" font-size="13" class="c-blue">投影 OA</text>
  <text x="320" y="352" font-size="12.5" class="c-gray" text-anchor="middle">线面角 θ = 斜线与它在平面上的投影的夹角；PO ≤ PA，等号仅当 A 与 O 重合</text>
</svg>
