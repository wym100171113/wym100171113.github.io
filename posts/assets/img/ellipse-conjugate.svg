<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>
    .c-red { color: #d63e3e; fill: #d63e3e; } .c-green { color: #2e8b57; fill: #2e8b57; }
    .c-blue { color: #3c6eb9; fill: #3c6eb9; }
    .c-ink { color: #1c1c1e; fill: #1c1c1e; } .c-gray { color: #6b7280; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .c-red { color: #f07070; fill: #f07070; } .c-green { color: #4caf7d; fill: #4caf7d; }
      .c-blue { color: #6b9df0; fill: #6b9df0; }
      .c-ink { color: #d8d8de; fill: #d8d8de; } .c-gray { color: #8e8e93; fill: #8e8e93; }
    }
    .nf { fill: none; }
    .semi { fill-opacity: 0.14; }
  </style>
<text x="320.0" y="30.0" font-size="16" class="c-ink" text-anchor="middle" font-weight="600">共轭直径：阿波罗尼奥斯的两个定值</text>
<ellipse cx="320.0" cy="244.0" rx="185.0" ry="110.0" stroke="currentColor" stroke-width="1.6" class="c-ink nf"/>
<polygon points="351.9,89.6 579.7,263.0 288.1,398.4 60.3,225.0" stroke="currentColor" stroke-width="1.5" class="c-blue nf"/>
<polygon points="320.0,244.0 465.8,176.3 351.9,89.6 206.1,157.3" stroke="currentColor" stroke-width="1.5" class="c-green semi"/>
<line x1="320.0" y1="244.0" x2="465.8" y2="176.3" stroke="currentColor" stroke-width="2.0" class="c-red"/>
<line x1="320.0" y1="244.0" x2="206.1" y2="157.3" stroke="currentColor" stroke-width="2.0" class="c-blue"/>
<line x1="320.0" y1="244.0" x2="174.2" y2="311.7" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5,4" class="c-red"/>
<line x1="320.0" y1="244.0" x2="433.9" y2="330.7" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5,4" class="c-blue"/>
<circle cx="465.8" cy="176.3" r="4.5" fill="currentColor" class="c-red"/>
<circle cx="206.1" cy="157.3" r="4.5" fill="currentColor" class="c-blue"/>
<circle cx="174.2" cy="311.7" r="3.2" fill="currentColor" class="c-red"/>
<circle cx="433.9" cy="330.7" r="3.2" fill="currentColor" class="c-blue"/>
<text x="477.8" y="170.3" font-size="14" class="c-red" text-anchor="middle" font-weight="500">P</text>
<text x="202.1" y="147.3" font-size="14" class="c-blue" text-anchor="middle" font-weight="500">Q</text>
<text x="172.2" y="329.7" font-size="12.5" class="c-red" text-anchor="middle" font-weight="500">−P</text>
<text x="433.9" y="348.7" font-size="12.5" class="c-blue" text-anchor="middle" font-weight="500">−Q</text>
<text x="308.0" y="258.0" font-size="13" class="c-ink" text-anchor="middle" font-weight="500">O</text>
<text x="359.9" y="91.6" font-size="13" class="c-green" text-anchor="start" font-weight="500">面积恒为 ab</text>
<text x="320.0" y="412.0" font-size="12.5" class="c-ink" text-anchor="middle">|OP|² + |OQ|² = a² + b²（定值）；以 OP、OQ 为边的平行四边形面积恒为 ab</text>
<text x="320.0" y="432.0" font-size="11.5" class="c-gray" text-anchor="middle">共轭 ⟺ P 处的切线平行于 OQ；圆里“互相垂直的直径”被压扁后就是共轭直径</text>
</svg>